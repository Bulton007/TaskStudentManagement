spring.application.name=api_student_management

server.port = 8080

#PostgreSQL 
spring.datasource.url=jdbc:postgresql://localhost:5432/student_management
spring.datasource.username=${DB_USERNAME:student_admin}
spring.datasource.password=${DB_PASSWORD:Student!@#123} 
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# JPA and HIBERNATE
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false 

# Display useful and error during development 
server.error.include-message=always 
server.error.include-binding-errors=always

# JWT 
jwt.secret = ${JWT_SECRET:student-api-development-secret-key-123456789}
jwt.expiration=3600
jwt.issuer= student-management-api

# Third Party
third-party.providers.json-placeholder.base-url=https://jsonplaceholder.typicode.com
third-party.providers.json-placeholder.timeouts=0s

third-party.providers.second-api.base-url=https://api.example.com
third-party.providers.second-api.timeouts=5s

# Redis Cache
spring.data.redis.host = localhost
spring.data.redis.port=6379

spring.cache.type = redis 
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false


